<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Widget</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; }

        .chat-launcher {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 100000;
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #854fff, #6b3fd4);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 14px 20px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(133,79,255,0.45);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .chat-launcher:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 28px rgba(133,79,255,0.6);
        }
        .chat-launcher.hidden { display: none; }

        .chat-prechat-card {
            display: none;
            position: fixed;
            bottom: 90px;
            right: 24px;
            width: 360px;
            max-width: calc(100vw - 48px);
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.18);
            padding: 24px;
            z-index: 100001;
            animation: popUp 0.25s ease-out;
        }
        .chat-prechat-card.show { display: block; }

        @keyframes popUp {
            from { transform: translateY(20px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 18px;
        }
        .card-header h2 {
            font-size: 17px;
            color: #222;
            font-weight: 700;
        }
        .card-header p {
            font-size: 12px;
            color: #888;
            margin-top: 3px;
        }
        .card-close {
            background: none;
            border: none;
            cursor: pointer;
            color: #aaa;
            font-size: 22px;
            line-height: 1;
            padding: 0;
            margin-left: 8px;
        }
        .card-close:hover { color: #333; }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 12px;
        }
        .field-group label {
            font-size: 13px;
            font-weight: 500;
            color: #444;
        }
        .field-group input {
            padding: 10px 12px;
            border: 1.5px solid #e0e0e0;
            border-radius: 8px;
            font-size: 13px;
            background: #fafafa;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .field-group input:focus {
            outline: none;
            border-color: #854fff;
            background: white;
            box-shadow: 0 0 0 3px rgba(133,79,255,0.12);
        }
        .field-group input.error { border-color: #e53e3e; background: #fff5f5; }
        .field-group .err-msg {
            font-size: 11px;
            color: #e53e3e;
            display: none;
        }
        .field-group .err-msg.show { display: block; }

        .btn-start {
            width: 100%;
            padding: 11px;
            background: linear-gradient(135deg, #854fff, #6b3fd4);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
            transition: opacity 0.2s;
        }
        .btn-start:hover   { opacity: 0.9; }
        .btn-start:disabled { opacity: 0.5; cursor: not-allowed; }

        .api-error {
            background: #fff5f5;
            border: 1px solid #fed7d7;
            color: #c53030;
            border-radius: 6px;
            padding: 9px 12px;
            font-size: 12px;
            margin-bottom: 12px;
            display: none;
        }
        .api-error.show { display: block; }

        .loading-state {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 24px 0;
        }
        .loading-state.show { display: flex; }
        .spinner {
            width: 22px; height: 22px;
            border: 3px solid #ede9fe;
            border-top: 3px solid #854fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .loading-state p { font-size: 13px; color: #666; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Chat Widget Styles from widget-hosted.js */
        .chat-assist-widget {
            --chat-color-primary: var(--chat-widget-primary, #854fff);
            --chat-color-secondary: var(--chat-widget-secondary, #6b3fd4);
            --chat-color-tertiary: var(--chat-widget-secondary, #6b3fd4);
            --chat-color-light: var(--chat-widget-light, #ede9fe);
            --chat-color-surface: var(--chat-widget-surface, #ffffff);
            --chat-color-text: var(--chat-widget-text, #333333);
            --chat-color-text-light: var(--chat-widget-text-light, #888888);
            --chat-color-border: var(--chat-widget-border, #e0e0e0);
            --chat-shadow-sm: 0 1px 3px rgba(133,79,255,0.1);
            --chat-shadow-md: 0 4px 6px rgba(133,79,255,0.15);
            --chat-shadow-lg: 0 10px 15px rgba(133,79,255,0.2);
            --chat-radius-sm: 8px;
            --chat-radius-md: 12px;
            --chat-radius-lg: 20px;
            --chat-radius-full: 9999px;
            --chat-transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        }

        .chat-assist-widget .chat-window {
            position: fixed;
            bottom: 90px;
            right: 20px;
            z-index: 1000;
            width: 380px;
            height: 580px;
            background: var(--chat-color-surface);
            border-radius: var(--chat-radius-lg);
            box-shadow: var(--chat-shadow-lg);
            border: 1px solid var(--chat-color-light);
            overflow: hidden;
            display: none;
            flex-direction: column;
            transition: var(--chat-transition);
            opacity: 0;
            transform: translateY(20px) scale(0.95);
        }

        .chat-assist-widget .chat-window.right-side { right: 20px; }
        .chat-assist-widget .chat-window.left-side { left: 20px; }
        .chat-assist-widget .chat-window.visible {
            display: flex;
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .chat-assist-widget .chat-header {
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, var(--chat-color-primary) 0%, var(--chat-color-secondary) 100%);
            color: white;
            position: relative;
        }

        .chat-assist-widget .chat-header-logo {
            width: 32px;
            height: 32px;
            border-radius: var(--chat-radius-sm);
            object-fit: contain;
            background: white;
            padding: 4px;
        }

        .chat-assist-widget .chat-header-title {
            font-size: 16px;
            font-weight: 600;
            color: white;
        }

        .chat-assist-widget .chat-close-btn {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--chat-transition);
            font-size: 18px;
            border-radius: var(--chat-radius-full);
            width: 28px;
            height: 28px;
        }

        .chat-assist-widget .chat-close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-50%) scale(1.1);
        }

        .chat-assist-widget .chat-welcome {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 24px;
            text-align: center;
            width: 100%;
            max-width: 320px;
        }

        .chat-assist-widget .chat-welcome-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--chat-color-text);
            margin-bottom: 24px;
            line-height: 1.3;
        }

        .chat-assist-widget .chat-start-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(135deg, var(--chat-color-primary) 0%, var(--chat-color-secondary) 100%);
            color: white;
            border: none;
            border-radius: var(--chat-radius-md);
            cursor: pointer;
            font-size: 15px;
            transition: var(--chat-transition);
            font-weight: 600;
            font-family: inherit;
            margin-bottom: 16px;
            box-shadow: var(--chat-shadow-md);
        }

        .chat-assist-widget .chat-start-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--chat-shadow-lg);
        }

        .chat-assist-widget .chat-response-time {
            font-size: 14px;
            color: var(--chat-color-text-light);
            margin: 0;
        }

        .chat-assist-widget .chat-body {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        .chat-assist-widget .chat-body.active {
            display: flex;
        }

        .chat-assist-widget .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f9fafb;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chat-assist-widget .chat-messages::-webkit-scrollbar { width: 6px; }
        .chat-assist-widget .chat-messages::-webkit-scrollbar-track { background: transparent; }
        .chat-assist-widget .chat-messages::-webkit-scrollbar-thumb {
            background-color: rgba(133, 79, 255, 0.3);
            border-radius: var(--chat-radius-full);
        }

        .chat-assist-widget .chat-bubble {
            padding: 14px 18px;
            border-radius: var(--chat-radius-md);
            max-width: 85%;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.6;
            position: relative;
            white-space: pre-line;
        }

        .chat-assist-widget .chat-bubble.user-bubble {
            background: linear-gradient(135deg, var(--chat-color-primary) 0%, var(--chat-color-secondary) 100%);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            box-shadow: var(--chat-shadow-sm);
        }

        .chat-assist-widget .chat-bubble.bot-bubble {
            background: white;
            color: var(--chat-color-text);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            box-shadow: var(--chat-shadow-sm);
            border: 1px solid var(--chat-color-light);
        }

        .chat-assist-widget .typing-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 14px 18px;
            background: white;
            border-radius: var(--chat-radius-md);
            border-bottom-left-radius: 4px;
            max-width: 80px;
            align-self: flex-start;
            box-shadow: var(--chat-shadow-sm);
            border: 1px solid var(--chat-color-light);
        }

        .chat-assist-widget .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--chat-color-primary);
            border-radius: var(--chat-radius-full);
            opacity: 0.7;
            animation: typingAnimation 1.4s infinite ease-in-out;
        }

        .chat-assist-widget .typing-dot:nth-child(1) { animation-delay: 0s; }
        .chat-assist-widget .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .chat-assist-widget .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingAnimation {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-4px); }
        }

        .chat-assist-widget .chat-controls {
            padding: 16px;
            background: var(--chat-color-surface);
            border-top: 1px solid var(--chat-color-light);
            display: flex;
            gap: 10px;
        }

        .chat-assist-widget .chat-textarea {
            flex: 1;
            padding: 14px 16px;
            border: 1px solid var(--chat-color-light);
            border-radius: var(--chat-radius-md);
            background: var(--chat-color-surface);
            color: var(--chat-color-text);
            resize: none;
            font-family: inherit;
            font-size: 14px;
            line-height: 1.5;
            max-height: 120px;
            min-height: 48px;
            transition: var(--chat-transition);
        }

        .chat-assist-widget .chat-textarea:focus {
            outline: none;
            border-color: var(--chat-color-primary);
            box-shadow: 0 0 0 3px rgba(133, 79, 255, 0.2);
        }

        .chat-assist-widget .chat-textarea::placeholder { color: var(--chat-color-text-light); }

        .chat-assist-widget .chat-submit {
            background: linear-gradient(135deg, var(--chat-color-primary) 0%, var(--chat-color-secondary) 100%);
            color: white;
            border: none;
            border-radius: var(--chat-radius-md);
            width: 48px;
            height: 48px;
            cursor: pointer;
            transition: var(--chat-transition);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: var(--chat-shadow-sm);
        }

        .chat-assist-widget .chat-submit:hover {
            transform: scale(1.05);
            box-shadow: var(--chat-shadow-md);
        }

        .chat-assist-widget .chat-submit svg {
            width: 22px;
            height: 22px;
        }

        .chat-assist-widget .chat-launcher {
            position: fixed;
            bottom: 20px;
            height: 56px;
            border-radius: var(--chat-radius-full);
            background: linear-gradient(135deg, var(--chat-color-primary) 0%, var(--chat-color-secondary) 100%);
            color: white;
            border: none;
            cursor: pointer;
            box-shadow: var(--chat-shadow-md);
            z-index: 999;
            transition: var(--chat-transition);
            display: flex;
            align-items: center;
            padding: 0 20px 0 16px;
            gap: 8px;
        }

        .chat-assist-widget .chat-launcher.right-side { right: 20px; }
        .chat-assist-widget .chat-launcher.left-side { left: 20px; }
        .chat-assist-widget .chat-launcher:hover {
            transform: scale(1.05);
            box-shadow: var(--chat-shadow-lg);
        }

        .chat-assist-widget .chat-launcher svg {
            width: 24px;
            height: 24px;
        }
        
        .chat-assist-widget .chat-launcher-text {
            font-weight: 600;
            font-size: 15px;
            white-space: nowrap;
        }

        .chat-assist-widget .chat-footer {
            padding: 10px;
            text-align: center;
            background: var(--chat-color-surface);
            border-top: 1px solid var(--chat-color-light);
        }

        .chat-assist-widget .chat-footer-link {
            color: var(--chat-color-primary);
            text-decoration: none;
            font-size: 12px;
            opacity: 0.8;
            transition: var(--chat-transition);
            font-family: inherit;
        }

        .chat-assist-widget .chat-footer-link:hover { opacity: 1; }

        .chat-assist-widget .suggested-questions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 12px 0;
            align-self: flex-start;
            max-width: 85%;
        }

        .chat-assist-widget .suggested-question-btn {
            background: #f3f4f6;
            border: 1px solid var(--chat-color-light);
            border-radius: var(--chat-radius-md);
            padding: 10px 14px;
            text-align: left;
            font-size: 13px;
            color: var(--chat-color-text);
            cursor: pointer;
            transition: var(--chat-transition);
            font-family: inherit;
            line-height: 1.4;
        }

        .chat-assist-widget .suggested-question-btn:hover {
            background: var(--chat-color-light);
            border-color: var(--chat-color-primary);
        }

        .chat-assist-widget .chat-link {
            color: var(--chat-color-primary);
            text-decoration: underline;
            word-break: break-all;
            transition: var(--chat-transition);
        }

        .chat-assist-widget .chat-link:hover {
            color: var(--chat-color-secondary);
            text-decoration: underline;
        }

        .chat-assist-widget .user-registration {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 24px;
            text-align: center;
            width: 100%;
            max-width: 320px;
            display: none;
        }

        .chat-assist-widget .user-registration.active { display: block; }

        .chat-assist-widget .registration-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--chat-color-text);
            margin-bottom: 16px;
            line-height: 1.3;
        }

        .chat-assist-widget .registration-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        .chat-assist-widget .form-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
            text-align: left;
        }

        .chat-assist-widget .form-label {
            font-size: 14px;
            font-weight: 500;
            color: var(--chat-color-text);
        }

        .chat-assist-widget .form-input {
            padding: 12px 14px;
            border: 1px solid var(--chat-color-border);
            border-radius: var(--chat-radius-md);
            font-family: inherit;
            font-size: 14px;
            transition: var(--chat-transition);
        }

        .chat-assist-widget .form-input:focus {
            outline: none;
            border-color: var(--chat-color-primary);
            box-shadow: 0 0 0 3px rgba(133, 79, 255, 0.2);
        }

        .chat-assist-widget .form-input.error { border-color: #ef4444; }

        .chat-assist-widget .error-text {
            font-size: 12px;
            color: #ef4444;
            margin-top: 2px;
        }

        .chat-assist-widget .submit-registration {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(135deg, var(--chat-color-primary) 0%, var(--chat-color-secondary) 100%);
            color: white;
            border: none;
            border-radius: var(--chat-radius-md);
            cursor: pointer;
            font-size: 15px;
            transition: var(--chat-transition);
            font-weight: 600;
            font-family: inherit;
            box-shadow: var(--chat-shadow-md);
        }

        .chat-assist-widget .submit-registration:hover {
            transform: translateY(-2px);
            box-shadow: var(--chat-shadow-lg);
        }

        .chat-assist-widget .submit-registration:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        @media (max-width: 480px) {
            .chat-prechat-card { right: 12px; left: 12px; width: auto; bottom: 80px; }
            .chat-launcher { right: 12px; bottom: 12px; }
            .chat-assist-widget .chat-window { right: 12px; width: calc(100vw - 24px); }
            .chat-assist-widget .chat-launcher.right-side { right: 12px; }
        }
    </style>
</head>
<body>

<button class="chat-launcher" id="chatLauncher">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 2H4C2.9 2 2 2.9 2 4v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/>
    </svg>
    Need Help?
</button>

<div class="chat-prechat-card" id="preChatCard">
    <div class="card-header">
        <div>
            <h2>Hi 👋 How can we help?</h2>
            <p>Fill in your details to start chatting</p>
        </div>
        <button class="card-close" id="cardClose">&times;</button>
    </div>

    <div class="api-error" id="apiError"></div>

    <form id="preChatForm">
        <div class="field-group">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" placeholder="John" autocomplete="given-name">
            <span class="err-msg"></span>
        </div>
        <div class="field-group">
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" placeholder="Doe" autocomplete="family-name">
            <span class="err-msg"></span>
        </div>
        <div class="field-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="john@example.com" autocomplete="email">
            <span class="err-msg"></span>
        </div>
        <button type="submit" class="btn-start" id="submitBtn">Start Chat →</button>
    </form>

    <div class="loading-state" id="loadingState">
        <div class="spinner"></div>
        <p>Connecting you...</p>
    </div>
</div>

<div id="chat-widget-root"></div>

<script>
(function() {
    const config = {
        webhook: {
            url: 'https://n8n.customcx.com/webhook/4091fa09-fb9a-4039-9411-7104d213f601/chat',
            route: 'general'
        },
        leadWebhook: {
            url: 'https://n8n.customcx.com/webhook/zoho-lead-upsert'
        },
        branding: {
            logo: 'https://customcx.com/favicon.ico',
            name: 'CustomCX Hotel',
            welcomeText: 'Hi 👋, how can we help?',
            responseTimeText: 'We typically respond right away',
            poweredBy: {
                text: 'Powered by n8n',
                link: 'https://n8n.io'
            }
        },
        style: {
            primaryColor: '#854fff',
            secondaryColor: '#6b3fd4',
            position: 'right',
            backgroundColor: '#ffffff',
            fontColor: '#333333'
        },
        suggestedQuestions: []
    };

    const launcher  = document.getElementById('chatLauncher');
    const card      = document.getElementById('preChatCard');
    const cardClose = document.getElementById('cardClose');
    const form      = document.getElementById('preChatForm');
    const submitBtn = document.getElementById('submitBtn');
    const apiError  = document.getElementById('apiError');
    const loading   = document.getElementById('loadingState');

    let userData = null;
    let chatInitialized = false;

    const chatWindow = document.createElement('div');
    chatWindow.className = 'chat-assist-widget';
    chatWindow.innerHTML = `
        <div class="chat-window right-side">
            <div class="chat-header">
                <img class="chat-header-logo" src="${config.branding.logo}" alt="${config.branding.name}">
                <span class="chat-header-title">${config.branding.name}</span>
                <button class="chat-close-btn">×</button>
            </div>
            <div class="chat-welcome">
                <h2 class="chat-welcome-title">${config.branding.welcomeText}</h2>
                <button class="chat-start-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    Start chatting
                </button>
                <p class="chat-response-time">${config.branding.responseTimeText}</p>
            </div>
            <div class="user-registration">
                <h2 class="registration-title">Please enter your details to start chatting</h2>
                <form class="registration-form">
                    <div class="form-field">
                        <label class="form-label" for="chat-user-name">Name</label>
                        <input type="text" id="chat-user-name" class="form-input" placeholder="Your name" required>
                        <div class="error-text" id="name-error"></div>
                    </div>
                    <div class="form-field">
                        <label class="form-label" for="chat-user-email">Email</label>
                        <input type="email" id="chat-user-email" class="form-input" placeholder="Your email address" required>
                        <div class="error-text" id="email-error"></div>
                    </div>
                    <button type="submit" class="submit-registration">Continue to Chat</button>
                </form>
            </div>
            <div class="chat-body">
                <div class="chat-messages"></div>
                <div class="chat-controls">
                    <textarea class="chat-textarea" placeholder="Type your message here..." rows="1"></textarea>
                    <button class="chat-submit">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 2L11 13"></path>
                            <path d="M22 2l-7 20-4-9-9-4 20-7z"></path>
                        </svg>
                    </button>
                </div>
                <div class="chat-footer">
                    <a class="chat-footer-link" href="${config.branding.poweredBy.link}" target="_blank">${config.branding.poweredBy.text}</a>
                </div>
            </div>
        </div>
        <button class="chat-launcher right-side" id="chatWidgetLauncher" style="display:none;">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
            </svg>
            <span class="chat-launcher-text">Need help?</span>
        </button>
    `;
    document.body.appendChild(chatWindow);

    chatWindow.style.setProperty('--chat-widget-primary', config.style.primaryColor);
    chatWindow.style.setProperty('--chat-widget-secondary', config.style.secondaryColor);
    chatWindow.style.setProperty('--chat-widget-surface', config.style.backgroundColor);
    chatWindow.style.setProperty('--chat-widget-text', config.style.fontColor);

    const chatLaunchBtn = chatWindow.querySelector('#chatWidgetLauncher');
    const chatWindowEl = chatWindow.querySelector('.chat-window');
    const startChatBtn = chatWindow.querySelector('.chat-start-btn');
    const chatBody = chatWindow.querySelector('.chat-body');
    const messagesContainer = chatWindow.querySelector('.chat-messages');
    const messageTextarea = chatWindow.querySelector('.chat-textarea');
    const sendButton = chatWindow.querySelector('.chat-submit');
    const registrationForm = chatWindow.querySelector('.registration-form');
    const userRegistration = chatWindow.querySelector('.user-registration');
    const chatWelcome = chatWindow.querySelector('.chat-welcome');
    const nameInput = chatWindow.querySelector('#chat-user-name');
    const emailInput = chatWindow.querySelector('#chat-user-email');
    const nameError = chatWindow.querySelector('#name-error');
    const emailError = chatWindow.querySelector('#email-error');

    let conversationId = '';
    let isWaitingForResponse = false;

    launcher.addEventListener('click', () => card.classList.toggle('show'));
    cardClose.addEventListener('click', () => card.classList.remove('show'));

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        apiError.classList.remove('show');
        if (!validate()) return;

        const firstName = document.getElementById('firstName').value.trim();
        const lastName  = document.getElementById('lastName').value.trim();
        const email     = document.getElementById('email').value.trim();
        const fullName  = firstName + ' ' + lastName;

        form.style.display = 'none';
        loading.classList.add('show');
        submitBtn.disabled = true;

        try {
            const res = await fetch(config.leadWebhook.url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    firstName,
                    lastName,
                    email,
                    clientSite: window.location.hostname
                })
            });

            if (!res.ok) throw new Error('Server error');

            userData = { name: fullName, email, firstName, lastName };

            setTimeout(() => {
                card.classList.remove('show');
                launcher.classList.add('hidden');
                loading.classList.remove('show');
                form.style.display = 'block';
                submitBtn.disabled = false;
                form.reset();

                chatWelcome.style.display = 'none';
                userRegistration.classList.add('active');
                chatWindowEl.classList.add('visible');
                chatLaunchBtn.style.display = 'none';
            }, 500);

        } catch (err) {
            console.error(err);
            apiError.textContent = 'Something went wrong. Please try again.';
            apiError.classList.add('show');
            form.style.display = 'block';
            loading.classList.remove('show');
            submitBtn.disabled = false;
        }
    });

    chatLaunchBtn.addEventListener('click', () => {
        chatWindowEl.classList.toggle('visible');
    });

    chatWindow.querySelectorAll('.chat-close-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            chatWindowEl.classList.remove('visible');
        });
    });

    startChatBtn.addEventListener('click', () => {
        chatWelcome.style.display = 'none';
        userRegistration.classList.add('active');
    });

    registrationForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        nameError.textContent = '';
        emailError.textContent = '';
        nameInput.classList.remove('error');
        emailInput.classList.remove('error');

        const name = nameInput.value.trim();
        const email = emailInput.value.trim();
        let isValid = true;

        if (!name) {
            nameError.textContent = 'Please enter your name';
            nameInput.classList.add('error');
            isValid = false;
        }

        if (!email) {
            emailError.textContent = 'Please enter your email';
            emailInput.classList.add('error');
            isValid = false;
        } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            emailError.textContent = 'Please enter a valid email address';
            emailInput.classList.add('error');
            isValid = false;
        }

        if (!isValid) return;

        userData = { name, email };
        conversationId = crypto.randomUUID();

        userRegistration.classList.remove('active');
        chatBody.classList.add('active');

        await loadSession(name, email);
    });

    async function loadSession(name, email) {
        const typingIndicator = createTypingIndicator();
        messagesContainer.appendChild(typingIndicator);

        try {
            const sessionData = [{
                action: "loadPreviousSession",
                sessionId: conversationId,
                route: config.webhook.route,
                metadata: { userId: email, userName: name }
            }];

            await fetch(config.webhook.url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(sessionData)
            });

            const userInfoData = {
                action: "sendMessage",
                sessionId: conversationId,
                route: config.webhook.route,
                chatInput: `Name: ${name}\nEmail: ${email}`,
                metadata: { userId: email, userName: name, isUserInfo: true }
            };

            const response = await fetch(config.webhook.url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(userInfoData)
            });

            const responseData = await response.json();
            messagesContainer.removeChild(typingIndicator);

            const botMessage = document.createElement('div');
            botMessage.className = 'chat-bubble bot-bubble';
            const messageText = Array.isArray(responseData) ? responseData[0].output : responseData.output;
            botMessage.innerHTML = linkifyText(messageText || 'Hi! How can I help you today?');
            messagesContainer.appendChild(botMessage);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

        } catch (error) {
            console.error('Session error:', error);
            messagesContainer.removeChild(typingIndicator);
            const errorMessage = document.createElement('div');
            errorMessage.className = 'chat-bubble bot-bubble';
            errorMessage.textContent = "Sorry, I couldn't connect. Please try again.";
            messagesContainer.appendChild(errorMessage);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
    }

    sendButton.addEventListener('click', () => sendMessage());
    messageTextarea.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });
    messageTextarea.addEventListener('input', () => {
        messageTextarea.style.height = 'auto';
        messageTextarea.style.height = (messageTextarea.scrollHeight > 120 ? 120 : messageTextarea.scrollHeight) + 'px';
    });

    async function sendMessage(messageText) {
        const text = messageText || messageTextarea.value.trim();
        if (!text || isWaitingForResponse) return;

        isWaitingForResponse = true;
        messageTextarea.value = '';
        messageTextarea.style.height = 'auto';

        const userMessage = document.createElement('div');
        userMessage.className = 'chat-bubble user-bubble';
        userMessage.textContent = text;
        messagesContainer.appendChild(userMessage);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;

        const typingIndicator = createTypingIndicator();
        messagesContainer.appendChild(typingIndicator);

        try {
            const requestData = {
                action: "sendMessage",
                sessionId: conversationId,
                route: config.webhook.route,
                chatInput: text,
                metadata: { userId: userData?.email, userName: userData?.name }
            };

            const response = await fetch(config.webhook.url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestData)
            });

            const responseData = await response.json();
            messagesContainer.removeChild(typingIndicator);

            const botMessage = document.createElement('div');
            botMessage.className = 'chat-bubble bot-bubble';
            const responseText = Array.isArray(responseData) ? responseData[0].output : responseData.output;
            botMessage.innerHTML = linkifyText(responseText || 'I didn\'t get a response. Please try again.');
            messagesContainer.appendChild(botMessage);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

        } catch (error) {
            console.error('Message error:', error);
            messagesContainer.removeChild(typingIndicator);
            const errorMessage = document.createElement('div');
            errorMessage.className = 'chat-bubble bot-bubble';
            errorMessage.textContent = "Sorry, I couldn't send your message. Please try again.";
            messagesContainer.appendChild(errorMessage);
            messagesContainer.scrollHeight;
        } finally {
            isWaitingForResponse = false;
        }
    }

    function createTypingIndicator() {
        const indicator = document.createElement('div');
        indicator.className = 'typing-indicator';
        indicator.innerHTML = `
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
        `;
        return indicator;
    }

    function linkifyText(text) {
        const urlPattern = /(\b(https?|ftp):\/\/[-A-Z0-9+&@#\/%?=~_|!:,.;]*[-A-Z0-9+&@#\/%=~_|])/gim;
        return text.replace(urlPattern, function(url) {
            return `<a href="${url}" target="_blank" rel="noopener noreferrer" class="chat-link">${url}</a>`;
        });
    }

    function validate() {
        let ok = true;
        [
            { id: 'firstName', msg: 'First name is required' },
            { id: 'lastName',  msg: 'Last name is required'  },
            { id: 'email',     msg: 'Email is required'      }
        ].forEach(f => {
            const input = document.getElementById(f.id);
            const err   = input.closest('.field-group').querySelector('.err-msg');
            input.classList.remove('error');
            err.classList.remove('show');
            if (!input.value.trim()) {
                input.classList.add('error');
                err.textContent = f.msg;
                err.classList.add('show');
                ok = false;
            } else if (f.id === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(input.value.trim())) {
                input.classList.add('error');
                err.textContent = 'Please enter a valid email';
                err.classList.add('show');
                ok = false;
            }
        });
        return ok;
    }
})();
</script>

</body>
</html>
