<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Widget</title>
    <link href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        /* Pre-Chat Form Modal */
        .chat-prechat-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 100001;
            justify-content: flex-end;
            align-items: flex-end;
        }

        .chat-prechat-modal.show {
            display: flex;
        }

        .chat-prechat-container {
            background: white;
            width: 100%;
            max-width: 400px;
            border-radius: 12px 12px 0 0;
            box-shadow: 0 5px 40px rgba(0, 0, 0, 0.16);
            padding: 24px;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .chat-prechat-header {
            margin-bottom: 20px;
        }

        .chat-prechat-header h2 {
            font-size: 20px;
            color: #333;
            margin-bottom: 8px;
        }

        .chat-prechat-header p {
            font-size: 14px;
            color: #666;
        }

        .chat-prechat-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .chat-prechat-form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .chat-prechat-form-group label {
            font-size: 14px;
            font-weight: 500;
            color: #333;
        }

        .chat-prechat-form-group input {
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        .chat-prechat-form-group input:focus {
            outline: none;
            border-color: #854fff;
            box-shadow: 0 0 0 3px rgba(133, 79, 255, 0.1);
        }

        .chat-prechat-form-group input.error {
            border-color: #dc3545;
        }

        .chat-prechat-form-group .error-text {
            font-size: 12px;
            color: #dc3545;
            display: none;
        }

        .chat-prechat-form-group .error-text.show {
            display: block;
        }

        .chat-prechat-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .chat-prechat-btn {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .chat-prechat-btn-submit {
            background: #854fff;
            color: white;
        }

        .chat-prechat-btn-submit:hover {
            background: #6b3fd4;
        }

        .chat-prechat-btn-submit:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .chat-prechat-btn-cancel {
            background: #f0f0f0;
            color: #333;
        }

        .chat-prechat-btn-cancel:hover {
            background: #e0e0e0;
        }

        .chat-loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .chat-loading.show {
            display: block;
        }

        .chat-spinner {
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #854fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .chat-error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }

        .chat-error-message.show {
            display: block;
        }

        /* Mobile responsiveness */
        @media (max-width: 480px) {
            .chat-prechat-container {
                max-width: 100%;
                border-radius: 12px;
            }
        }
    </style>
</head>
<body>

<!-- Pre-Chat Modal -->
<div class="chat-prechat-modal" id="preChatModal">
    <div class="chat-prechat-container">
        <div class="chat-prechat-header">
            <h2>Start a conversation</h2>
            <p>Please provide your details to begin</p>
        </div>

        <div class="chat-error-message" id="errorMessage"></div>

        <form class="chat-prechat-form" id="preChatForm">
            <div class="chat-prechat-form-group">
                <label for="firstName">First Name *</label>
                <input type="text" id="firstName" name="firstName" required placeholder="John">
                <span class="error-text"></span>
            </div>

            <div class="chat-prechat-form-group">
                <label for="lastName">Last Name *</label>
                <input type="text" id="lastName" name="lastName" required placeholder="Doe">
                <span class="error-text"></span>
            </div>

            <div class="chat-prechat-form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" required placeholder="john@example.com">
                <span class="error-text"></span>
            </div>

            <div class="chat-prechat-buttons">
                <button type="button" class="chat-prechat-btn chat-prechat-btn-cancel" id="cancelBtn">Cancel</button>
                <button type="submit" class="chat-prechat-btn chat-prechat-btn-submit" id="submitBtn">Start Chat</button>
            </div>
        </form>

        <div class="chat-loading" id="loadingState">
            <div class="chat-spinner"></div>
            <p>Connecting...</p>
        </div>
    </div>
</div>

<!-- Chat Widget Root -->
<div id="chat-widget-root"></div>

<!-- N8N Chat Configuration -->
<script>
    window.ChatWidgetConfig = {
        webhook: {
            url: 'https://n8n.customcx.com/webhook/4091fa09-fb9a-4039-9411-7104d213f601/chat',
            route: 'general',
            zohoUrl: 'https://n8n.customcx.com/webhook/zoho-lead-upsert'
        },
        branding: {
            logo: 'https://customcx.com/favicon.ico',
            name: 'CustomCX Hotel',
            welcomeText: 'Hi 👋, how can we help?',
            responseTimeText: 'We typically respond right away'
        },
        style: {
            primaryColor: '#854fff',
            secondaryColor: '#6b3fd4',
            position: 'right',
            backgroundColor: '#ffffff',
            fontColor: '#333333'
        }
    };
</script>

<!-- Pre-Chat Form Handler -->
<script>
    const preChatModal = document.getElementById('preChatModal');
    const preChatForm = document.getElementById('preChatForm');
    const cancelBtn = document.getElementById('cancelBtn');
    const submitBtn = document.getElementById('submitBtn');
    const errorMessage = document.getElementById('errorMessage');
    const loadingState = document.getElementById('loadingState');
    const formElement = document.querySelector('.chat-prechat-form');

    let chatInitialized = false;

    // Show pre-chat modal when page loads
    window.addEventListener('load', function() {
        if (!localStorage.getItem('chat_user_submitted')) {
            setTimeout(() => {
                preChatModal.classList.add('show');
            }, 500);
        }
    });

    // Cancel button
    cancelBtn.addEventListener('click', function() {
        preChatModal.classList.remove('show');
    });

    // Form submission
    preChatForm.addEventListener('submit', async function(e) {
        e.preventDefault();

        // Clear previous error
        errorMessage.classList.remove('show');

        // Validate form
        if (!validateForm()) {
            return;
        }

        // Get form data
        const firstName = document.getElementById('firstName').value.trim();
        const lastName = document.getElementById('lastName').value.trim();
        const email = document.getElementById('email').value.trim();

        // Show loading state
        formElement.style.display = 'none';
        loadingState.classList.add('show');
        submitBtn.disabled = true;

        try {
            // Send to Zoho webhook
            const response = await fetch('https://n8n.customcx.com/webhook/zoho-lead-upsert', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    firstName: firstName,
                    lastName: lastName,
                    email: email,
                    clientSite: window.location.hostname
                })
            });

            if (!response.ok) {
                throw new Error('Failed to submit form');
            }

            // Store in localStorage so modal doesn't show again this session
            localStorage.setItem('chat_user_submitted', JSON.stringify({
                firstName: firstName,
                lastName: lastName,
                email: email,
                timestamp: new Date().toISOString()
            }));

            // Close modal after 1 second
            setTimeout(() => {
                preChatModal.classList.remove('show');
                loadingState.classList.remove('show');
                formElement.style.display = 'flex';
                
                // Initialize chat widget
                if (!chatInitialized) {
                    initializeChatWidget();
                }
            }, 1000);

        } catch (error) {
            console.error('Error submitting form:', error);
            errorMessage.textContent = 'Failed to submit. Please try again.';
            errorMessage.classList.add('show');
            formElement.style.display = 'flex';
            loadingState.classList.remove('show');
            submitBtn.disabled = false;
        }
    });

    // Form validation
    function validateForm() {
        let isValid = true;
        const firstName = document.getElementById('firstName');
        const lastName = document.getElementById('lastName');
        const email = document.getElementById('email');

        // Reset errors
        document.querySelectorAll('.chat-prechat-form-group').forEach(group => {
            group.querySelector('input').classList.remove('error');
            group.querySelector('.error-text').classList.remove('show');
        });

        // Validate first name
        if (!firstName.value.trim()) {
            showFieldError(firstName, 'First name is required');
            isValid = false;
        }

        // Validate last name
        if (!lastName.value.trim()) {
            showFieldError(lastName, 'Last name is required');
            isValid = false;
        }

        // Validate email
        if (!email.value.trim()) {
            showFieldError(email, 'Email is required');
            isValid = false;
        } else if (!isValidEmail(email.value.trim())) {
            showFieldError(email, 'Please enter a valid email');
            isValid = false;
        }

        return isValid;
    }

    function showFieldError(input, message) {
        input.classList.add('error');
        const errorText = input.closest('.chat-prechat-form-group').querySelector('.error-text');
        errorText.textContent = message;
        errorText.classList.add('show');
    }

    function isValidEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    // Initialize chat widget
    function initializeChatWidget() {
        chatInitialized = true;

        // Load n8n chat widget script
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/gh/funtastic418/chat-widget@main/chat-widget.js';
        script.async = true;
        script.onload = function() {
            if (window.ChatWidget && typeof window.ChatWidget.init === 'function') {
                window.ChatWidget.init(window.ChatWidgetConfig);
            }
        };
        script.onerror = function() {
            console.error('Failed to load chat widget');
        };
        document.body.appendChild(script);
    }
</script>

</body>
</html>
